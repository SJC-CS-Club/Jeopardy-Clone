    <div class="teams">
      <!-- Team 1 -->
      <div class="team">
        <h2 contenteditable="true">Team 1</h2>
        <hr />
        <div class="counter" id="counter_one">0</div>
        <div class="team-buttons">
          <button
            class="minus"
            data-team="counter_one"
            type="button"
            title="Decrease score for Team 1"
          >
            <i class="bx bx-minus"></i>
          </button>
          <button
            class="plus"
            data-team="counter_one"
            type="button"
            title="Increase score for Team 1"
          >
            <i class="bx bx-plus"></i>
          </button>
        </div>
      </div>
      <!-- Team 2 -->
      <div class="team">
        <h2 contenteditable="true">Team 2</h2>
